name: CI

# Docs-only changes (README, GIF, license) don't need a run.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "readme_assets/**"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  push:
    paths-ignore:
      - "**.md"
      - "readme_assets/**"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Type-check and build the Astro site. Lighthouse and browser tests for the
  # new site come back in phase 5 (REDESIGN.md); the old site's tests are in
  # legacy/ and no longer run.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
