name: Deploy

on:
  # Runs after CI has passed on main, so the checks aren't run twice.
  # On any other branch nothing deploys.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI just tested (workflow_run), otherwise the current one.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history: the sitemap's lastmod is each page's last commit
          fetch-depth: 0
      # Installs dependencies, runs `npm run build` and uploads dist/ as the
      # Pages artifact.
      - uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # Optional: the content of Google Search Console's verification
          # meta tag, as a repository variable (Settings → Secrets and
          # variables → Actions → Variables). Unset, no tag is rendered.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
